      const DAILY_PICK_COUNT = 4;

      function hashCode(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) {
          h = (h << 5) - h + str.charCodeAt(i);
          h |= 0;
        }
        return h;
      }

      function mulberry32(seed) {
        let a = seed;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function seededShuffle(arr, seed) {
        const rnd = mulberry32(seed);
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(rnd() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function todaysActivities(stageId, dateKey) {
        const pool = ACTIVITIES[stageId];
        const seed = hashCode(dateKey + ":" + stageId);
        return seededShuffle(pool, seed).slice(0, DAILY_PICK_COUNT);
      }

      /* ---------------- helpers ---------------- */

      function todayKey() {
        return new Date().toISOString().slice(0, 10);
      }

      function ageInDays(birthISO) {
        const ms = Date.now() - new Date(birthISO + "T00:00:00").getTime();
        return Math.max(0, Math.floor(ms / 86400000));
      }

      function ageLabel(days) {
        if (days < 14) return days + (days === 1 ? " day old" : " days old");
        if (days < 60) return Math.floor(days / 7) + " weeks old";
        const months = days / 30.44;
        const whole = Math.floor(months);
        const remWeeks = Math.round((months - whole) * 4.35);
        if (remWeeks <= 0)
          return whole + (whole === 1 ? " month old" : " months old");
        return whole + " mo, " + remWeeks + " wk old";
      }

      function stageForDays(days) {
        return (
          STAGES.find((s) => days >= s.minDay && days < s.maxDay) ||
          STAGES[STAGES.length - 1]
        );
      }

      function goldenPoints(n, cx, cy, scale) {
        const golden = Math.PI * (3 - Math.sqrt(5));
        const pts = [];
        for (let i = 0; i < n; i++) {
          const r = scale * Math.sqrt(i + 1);
          const theta = i * golden;
          pts.push({
            x: cx + r * Math.cos(theta),
            y: cy + r * Math.sin(theta),
          });
        }
        return pts;
      }

      const STORAGE_PREFIX = "little-sparks:";

      async function loadJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(STORAGE_PREFIX + key);
          if (raw === null) return fallback;
          return JSON.parse(raw);
        } catch (e) {

        }
      }

      async function saveJSON(key, value) {
        try {
          localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
        } catch (e) {
          /* storage full or unavailable — fail silently */
        }
      }

      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      /* ---------------- svg icons (inline, minimal) ---------------- */

      const ICON_BRAIN =
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/></svg>';
      const ICON_PENCIL =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
      const ICON_CHECK =
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      const ICON_CHEVRON =
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

      /* ---------------- rendering ---------------- */

      function renderBloom(count, total) {
        const nodes = goldenPoints(total, 150, 150, 15.5);
        const active = Math.min(count, total);
        let lines = "";
        let circles = "";
        for (let i = 0; i < active; i++) {
          if (i > 0) {
            const prev = nodes[i - 1];
            const p = nodes[i];
            lines += `<line x1="${prev.x}" y1="${prev.y}" x2="${p.x}" y2="${p.y}" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="1"/>`;
          }
        }
        nodes.forEach((p, i) => {
          const isActive = i < active;
          circles += `<circle cx="${p.x}" cy="${p.y}" r="${isActive ? 4 : 2.5}" fill="${isActive ? "var(--accent)" : "var(--muted)"}" fill-opacity="${isActive ? 0.9 : 0.35}" style="transition: all 0.5s ease"/>`;
        });
        return `
  <svg viewBox="0 0 300 300" style="width:100%;height:100%" role="img" aria-label="Brain connection bloom">
    <defs>
      <radialGradient id="bloomGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="150" cy="150" r="140" fill="url(#bloomGlow)"/>
    ${lines}
    ${circles}
    <circle cx="150" cy="150" r="5.5" fill="var(--accent-2)"/>
  </svg>`;
      }

      function renderSetup() {
        return `
  <div class="setup">
    <div class="icon-circle">${ICON_BRAIN}</div>
    <h1 class="font-display">Little Sparks</h1>
    <p class="tagline">Daily activities, milestones, and the science behind them — tuned to your baby's first six months.</p>
    <div class="setup-form">
      <div class="field">
        <label>Baby's name</label>
        <input id="input-name" type="text" placeholder="e.g. Amara" value="${state.profile ? esc(state.profile.name) : ""}"/>
      </div>
      <div class="field">
        <label>Birth date</label>
        <input id="input-birth" type="date" max="${todayKey()}" value="${state.profile ? state.profile.birth : ""}"/>
      </div>
      <button id="btn-save-profile" class="btn-primary">Start tracking</button>
    </div>
  </div>`;
      }

      function renderHeader() {
        const days = ageInDays(state.profile.birth);
        const stage = stageForDays(days);
        const actCount = Object.values(state.activityLog).reduce(
          (s, arr) => s + (arr ? arr.length : 0),
          0,
        );
        const msCount = Object.keys(state.milestoneLog).length;
        const total = actCount + msCount;

        return `
  <div class="header">
    <div class="header-top">
      <div>
        <p class="header-eyebrow font-mono">${esc(stage.label)} · ${esc(stage.range)}</p>
        <h1 class="header-name font-display">${esc(state.profile.name)}</h1>
        <p class="header-age">${ageLabel(days)}</p>
      </div>
      <button class="edit-btn" id="btn-edit-profile" aria-label="Edit profile">${ICON_PENCIL}</button>
    </div>
    <div class="bloom-wrap">${renderBloom(total, 40)}</div>
    <p class="bloom-caption">${total} connections logged so far</p>
  </div>
  <nav class="tabs">
    ${["today", "milestones", "library"]
      .map((id) => {
        const labels = {
          today: "Today",
          milestones: "Milestones",
          library: "Learn",
        };
        return `<button class="tab-btn ${state.tab === id ? "active" : ""}" data-tab="${id}">${labels[id]}</button>`;
      })
      .join("")}
  </nav>`;
      }

      function renderToday() {
        const days = ageInDays(state.profile.birth);
        const stage = stageForDays(days);
        const list = todaysActivities(stage.id, todayKey());
        const doneToday = state.activityLog[todayKey()] || [];
        const doneFromToday = list.filter((a) =>
          doneToday.includes(a.id),
        ).length;

        let html = `<p class="today-count">${doneFromToday} of ${list.length} done today · new picks tomorrow</p>`;
        list.forEach((act) => {
          const done = doneToday.includes(act.id);
          html += `
    <div class="activity-card ${done ? "done" : ""}">
      <button class="check-circle ${done ? "checked" : ""}" data-activity="${act.id}" aria-label="${done ? "Mark not done" : "Mark done"}">
        ${done ? ICON_CHECK : ""}
      </button>
      <div class="activity-body">
        <div class="activity-title-row">
          <p class="activity-title">${esc(act.title)}</p>
          <span class="activity-minutes font-mono">${act.minutes} min</span>
        </div>
        <p class="activity-why">${esc(act.why)}</p>
      </div>
    </div>`;
        });
        return html;
      }

      function renderMilestones() {
        let html = "";
        MILESTONE_DOMAINS.forEach((domain) => {
          html += `<div class="domain-block">
      <div class="domain-title-row"><h2 class="domain-title font-display">${esc(domain.label)}</h2></div>`;
          domain.items.forEach((item) => {
            const achieved = state.milestoneLog[item.id];
            html += `
      <button class="milestone-item ${achieved ? "done" : ""}" data-milestone="${item.id}">
        <span class="milestone-check ${achieved ? "checked" : ""}">${achieved ? ICON_CHECK : ""}</span>
        <span class="milestone-label">${esc(item.label)}</span>
        ${achieved ? `<span class="milestone-date font-mono">${achieved}</span>` : ""}
      </button>`;
          });
          html += `</div>`;
        });
        return html;
      }

      function renderLibrary() {
        let html = "";
        LIBRARY.forEach((art) => {
          const open = state.openArticle === art.id;
          html += `
    <div class="article-card">
      <button class="article-toggle" data-article="${art.id}">
        <div>
          <p class="article-tag font-mono">${esc(art.tag)}</p>
          <p class="article-title">${esc(art.title)}</p>
        </div>
        <span class="chevron ${open ? "open" : ""}">${ICON_CHEVRON}</span>
      </button>
      ${open ? `<p class="article-body">${esc(art.body)}</p>` : ""}
    </div>`;
        });
        return html;
      }

      function render() {
        const app = document.getElementById("app");

        if (!state.ready) {
          app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--muted-text)">Loading…</div>`;
          return;
        }

        if (!state.profile || state.editingProfile) {
          app.innerHTML = renderSetup();
          attachSetupHandlers();
          return;
        }

        let panel = "";
        if (state.tab === "today") panel = renderToday();
        else if (state.tab === "milestones") panel = renderMilestones();
        else panel = renderLibrary();

        app.innerHTML = renderHeader() + `<div class="panel">${panel}</div>`;
        attachMainHandlers();
      }

      /* ---------------- event handlers ---------------- */

      function attachSetupHandlers() {
        const btn = document.getElementById("btn-save-profile");
        const nameInput = document.getElementById("input-name");
        const birthInput = document.getElementById("input-birth");

        function updateBtn() {
          btn.disabled = !nameInput.value || !birthInput.value;
        }
        nameInput.addEventListener("input", updateBtn);
        birthInput.addEventListener("input", updateBtn);
        updateBtn();

        btn.addEventListener("click", async () => {
          if (!nameInput.value || !birthInput.value) return;
          state.profile = { name: nameInput.value, birth: birthInput.value };
          state.editingProfile = false;
          await saveJSON("baby-profile", state.profile);
          render();
        });
      }

      function attachMainHandlers() {
        document
          .getElementById("btn-edit-profile")
          .addEventListener("click", () => {
            state.editingProfile = true;
            render();
          });

        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.tab = btn.dataset.tab;
            render();
          });
        });

        document.querySelectorAll("[data-activity]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.activity;
            const key = todayKey();
            const list = new Set(state.activityLog[key] || []);
            list.has(id) ? list.delete(id) : list.add(id);
            state.activityLog[key] = Array.from(list);
            await saveJSON("activity-log", state.activityLog);
            render();
          });
        });

        document.querySelectorAll("[data-milestone]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.milestone;
            if (state.milestoneLog[id]) delete state.milestoneLog[id];
            else state.milestoneLog[id] = todayKey();
            await saveJSON("milestone-log", state.milestoneLog);
            render();
          });
        });

        document.querySelectorAll("[data-article]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.article;
            state.openArticle = state.openArticle === id ? null : id;
            render();
          });
        });
      }

      /* ---------------- init ---------------- */

      (async function init() {
        state.profile = await loadJSON("baby-profile", null);
        state.activityLog = await loadJSON("activity-log", {});
        state.milestoneLog = await loadJSON("milestone-log", {});
        state.ready = true;
        render();
      })();
    </script>
  </body>
</html>
